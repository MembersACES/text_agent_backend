# Carbon Zero (memberscza GCP) — backend Cloud Run deploy.
# Create two Cloud Build triggers in the CZA project pointing at this file:
#   • branch dev  → override _CLOUD_RUN_SERVICE=text-agent-backend-dev
#   • branch main → default text-agent-backend (prod)
#
# Cloud SQL, DATABASE_URL, service accounts, and CORS_EXTRA_ORIGINS are configured
# on the Cloud Run service (see docs/CZA_DEPLOY_PHASE2.md in text_agent_interface).

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: australia-southeast2
  _CLOUD_RUN_SERVICE: text-agent-backend
  _IMAGE_REPO: github.com/membersaces/text_agent_backend

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_IMAGE_REPO}:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/${_IMAGE_REPO}:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_CLOUD_RUN_SERVICE}
      - --image
      - gcr.io/$PROJECT_ID/${_IMAGE_REPO}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --project
      - $PROJECT_ID

images:
  - gcr.io/$PROJECT_ID/${_IMAGE_REPO}:$COMMIT_SHA
